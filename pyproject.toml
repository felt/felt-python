[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "felt-python"
version = "0.2.0"
authors = [
  { name="Álvaro Arredondo", email="alvaro@felt.com" },
  { name="Vince Foley", email="vince@felt.com" },
  { name="Chris Loer", email="chris@felt.com" },
]
description = "The official Felt API client library"
readme = "README.md"
requires-python = ">=3.6"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/felt/felt-python"
Issues = "https://github.com/felt/felt-python/issues"
Documentation = "https://developers.felt.com"

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Pin to ruff's pre-0.16 default rules: CI installs the latest ruff, and the
# 0.16 release widened the default selection (import sorting, datetime
# timezone checks, ...) in a way that flags most of the existing codebase.
select = ["E4", "E7", "E9", "F"]
